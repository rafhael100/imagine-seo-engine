name: SEO F175 - reconcile pinned official IBGE DTB and Area 2025
on:
  pull_request:
    paths:
      - '.github/workflows/seo-f175-two-official-products-ci.yml'
      - 'scripts/compare-pinned-dtb-areas2025.py'
      - 'tests/test_compare_pinned_dtb_areas2025.py'
      - 'docs/SEO-F175-OFFICIAL-DTB-AREA-CROSSCHECK.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-official-products:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run offline F175 and F172 parser tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_compare_pinned_dtb_areas2025.py -v
          python3 -m unittest discover -s tests -p test_normalize_official_dtb_2025.py -v
      - name: One bounded capture for two pinned original official products
        shell: bash
        run: |
          set -euo pipefail
          dtb_zip="${RUNNER_TEMP}/official-dtb-2025.zip"
          area_ods="${RUNNER_TEMP}/official-areas-2025.ods"
          dtb_csv="${RUNNER_TEMP}/private-dtb-2025.csv"
          trap 'rm -f "$dtb_zip" "$area_ods" "$dtb_csv"' EXIT
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --retry 0 --connect-timeout 10 --max-time 45 --max-filesize 5000000 \
            --output "$dtb_zip" \
            'https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2025/DTB_2025.zip'
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --retry 0 --connect-timeout 10 --max-time 45 --max-filesize 1000000 \
            --output "$area_ods" \
            'https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/areas_territoriais/2025/AR_BR_RG_UF_RGINT_RGI_MUN_2025.ods'
          printf '%s  %s\n' d077a0e48c36cf18bcc96268b4a436200c014c6b8522c1a62d894acaf39dad27 "$dtb_zip" | sha256sum --check --status
          printf '%s  %s\n' 029219bb994d87750fbe7d26c31217152a7e95449ddd2d2f26b504cb32a425f1 "$area_ods" | sha256sum --check --status
          python3 scripts/normalize-official-dtb-2025.py "$dtb_zip" "$dtb_csv"
          python3 scripts/compare-pinned-dtb-areas2025.py "$dtb_csv" "$area_ods"
          test "$(stat -c %a "$dtb_csv")" = 600
