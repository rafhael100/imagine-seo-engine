name: SEO F139 - private GSC HTML and loopback HTTP staging integration
on:
  pull_request:
    paths:
      - 'labs/seo-f139-staging/**'
      - 'scripts/run-local-staging-migration-qa.mjs'
      - 'tests/combined-loopback-staging-qa.test.mjs'
      - 'docs/SEO-F139-ONE-COMMAND-ISOLATED-STAGING-QA.md'
      - '.github/workflows/seo-f139-integrated-staging-qa-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-staging-command:
    name: Original GSC + HTML + live loopback HEAD / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Validate staging lab and full Engine regression
        run: |
          set -euo pipefail
          node --check labs/seo-f139-staging/combined-local-staging-qa.mjs
          node --check scripts/run-local-staging-migration-qa.mjs
          node --check tests/combined-loopback-staging-qa.test.mjs
          npm test
      - name: Require pristine checkout after tests
        run: test -z "$(git status --porcelain --untracked-files=no)"
