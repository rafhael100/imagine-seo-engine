name: SEO F177 - reconcile official 2025 localities excluding two operational areas
on:
  pull_request:
    paths:
      - '.github/workflows/seo-f177-official-operational-areas-ci.yml'
      - 'scripts/reconcile-pinned-ibge-two-products.py'
      - 'tests/test_reconcile_pinned_ibge_two_products.py'
      - 'docs/SEO-F177-OFFICIAL-2025-OPERATIONAL-AREAS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-official-geocodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed code without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test strict two-area exception classifier
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_reconcile_pinned_ibge_two_products.py -v
          python3 -m unittest discover -s tests -p test_compare_pinned_dtb_areas2025.py -v
      - name: Use exact original IBGE 2025 publications and reconcile municipality roster
        shell: bash
        run: |
          set -euo pipefail
          dtb="${RUNNER_TEMP}/dtb-2025.zip"
          normalized="${RUNNER_TEMP}/dtb-2025.csv"
          area="${RUNNER_TEMP}/area-2025.ods"
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --retry 0 --connect-timeout 10 --max-time 45 --max-filesize 5000000 \
            --output "$dtb" \
            'https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2025/DTB_2025.zip'
          printf '%s  %s\n' d077a0e48c36cf18bcc96268b4a436200c014c6b8522c1a62d894acaf39dad27 "$dtb" | sha256sum --check --status
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --retry 0 --connect-timeout 10 --max-time 45 --max-filesize 1000000 \
            --output "$area" \
            'https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/areas_territoriais/2025/AR_BR_RG_UF_RGINT_RGI_MUN_2025.ods'
          printf '%s  %s\n' 029219bb994d87750fbe7d26c31217152a7e95449ddd2d2f26b504cb32a425f1 "$area" | sha256sum --check --status
          python3 scripts/normalize-official-dtb-2025.py "$dtb" "$normalized"
          test "$(stat -c %a "$normalized")" = 600
          python3 scripts/reconcile-pinned-ibge-two-products.py "$normalized" "$area"
          rm -f "$dtb" "$normalized" "$area"
