name: SEO F153 - IBGE 2025 municipality versus locality structural coverage
on:
  pull_request:
    paths:
      - 'src/ibge-national-edition-coverage.mjs'
      - 'scripts/review-ibge-national-edition-offline.mjs'
      - 'tests/ibge-national-edition-coverage.test.mjs'
      - 'tests/ibge-national-edition-cli.test.mjs'
      - 'docs/SEO-F153-IBGE-2025-TERRITORIAL-CLASSIFICATION.md'
      - '.github/workflows/seo-f153-ibge-national-coverage-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  national-territory:
    name: IBGE 2025 locality/municipality separation / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout without retained token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Strict syntax and entire offline regression suite
        run: |
          set -euo pipefail
          node --check src/ibge-national-edition-coverage.mjs
          node --check scripts/review-ibge-national-edition-offline.mjs
          node --check tests/ibge-national-edition-coverage.test.mjs
          node --check tests/ibge-national-edition-cli.test.mjs
          npm test
      - name: Source checkout must be pristine
        run: test -z "$(git status --porcelain --untracked-files=no)"
