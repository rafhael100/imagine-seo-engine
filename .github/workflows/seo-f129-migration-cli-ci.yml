name: SEO F129 - staging operator legacy redirect preflight CLI

on:
  pull_request:
    paths:
      - 'scripts/review-legacy-migration-build-offline.mjs'
      - 'tests/legacy-migration-build-cli.test.mjs'
      - 'docs/SEO-F129-STAGING-REDIRECT-CLI.md'
      - '.github/workflows/seo-f129-migration-cli-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-cli:
    name: Legacy migration CLI offline / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Validate CLI and offline regression suite
        run: |
          set -euo pipefail
          node --check scripts/review-legacy-migration-build-offline.mjs
          node --check tests/legacy-migration-build-cli.test.mjs
          npm test
      - name: Confirm source unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"
