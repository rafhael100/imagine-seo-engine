name: SEO F137 - combined private migration QA CLI
on:
  pull_request:
    paths:
      - 'scripts/review-migration-cross-evidence-offline.mjs'
      - 'tests/migration-cross-evidence-cli.test.mjs'
      - 'docs/SEO-F137-THREE-SOURCE-OPERATOR-CLI.md'
      - '.github/workflows/seo-f137-cross-evidence-cli-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-cli:
    name: GSC-HTTP-HTML private CLI / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax, full offline tests and HTML fixture verification
        run: |
          set -euo pipefail
          node --check scripts/review-migration-cross-evidence-offline.mjs
          node --check tests/migration-cross-evidence-cli.test.mjs
          npm test
      - name: Assert no tracked source mutation
        run: test -z "$(git status --porcelain --untracked-files=no)"
