name: SEO F143 - full staged GSC build 301 and HTML bytes review
on:
  pull_request:
    paths:
      - 'labs/seo-f143-full-served-gate/**'
      - 'scripts/run-served-html-staging-qa.mjs'
      - 'src/private-staging-artifact-custody.mjs'
      - 'tests/served-html-attested-staging-gate.test.mjs'
      - 'docs/SEO-F143-COMBINED-SERVED-HTML-STAGING-QA.md'
      - '.github/workflows/seo-f143-served-html-staging-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-staging-qa:
    name: Local HEAD+GET against compiled HTML / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout SHA without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Validate syntax and all full-suite integration tests
        run: |
          set -euo pipefail
          node --check labs/seo-f143-full-served-gate/run-served-html-staging-gate.mjs
          node --check scripts/run-served-html-staging-qa.mjs
          node --check tests/served-html-attested-staging-gate.test.mjs
          npm test
      - name: Assert original Git checkout unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"
