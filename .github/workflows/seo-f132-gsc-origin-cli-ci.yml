name: SEO F132 - private GSC page origin CLI offline
on:
  pull_request:
    paths:
      - 'scripts/review-gsc-page-origins-offline.mjs'
      - 'tests/gsc-page-origin-operator-cli.test.mjs'
      - 'docs/SEO-F132-PRIVATE-GSC-PAGE-ORIGIN-CLI.md'
      - '.github/workflows/seo-f132-gsc-origin-cli-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator-cli:
    name: Offline privacy and CLI / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Parse and run all offline tests
        run: |
          set -euo pipefail
          node --check scripts/review-gsc-page-origins-offline.mjs
          node --check tests/gsc-page-origin-operator-cli.test.mjs
          npm test
      - name: Ensure no tracked writes
        run: test -z "$(git status --porcelain --untracked-files=no)"
