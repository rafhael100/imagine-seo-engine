name: SEO F168 - national city template doorway review (offline)
on:
  pull_request:
    paths:
      - '.github/workflows/seo-f168-national-template-ci.yml'
      - 'src/geo-national-template-review.mjs'
      - 'scripts/review-national-city-templates-offline.mjs'
      - 'tests/geo-national-template-review.test.mjs'
      - 'docs/SEO-F168-NATIONAL-DOORWAY-TEMPLATE-GATE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-template:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test all input boundaries and city-substitution detection
        run: |
          set -euo pipefail
          node --test tests/geo-national-template-review.test.mjs
          node --check scripts/review-national-city-templates-offline.mjs
