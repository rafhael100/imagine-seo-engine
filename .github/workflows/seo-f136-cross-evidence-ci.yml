name: SEO F136 - independent GSC HTTP301 compiled HTML release gate
on:
  pull_request:
    paths:
      - 'src/migration-cross-evidence-release-gate.mjs'
      - 'tests/migration-cross-evidence-release-gate.test.mjs'
      - 'docs/SEO-F136-CROSS-EVIDENCE-RELEASE-GATE.md'
      - '.github/workflows/seo-f136-cross-evidence-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-checks:
    name: Offline three-source gate / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and full offline regression
        run: |
          set -euo pipefail
          node --check src/migration-cross-evidence-release-gate.mjs
          node --check tests/migration-cross-evidence-release-gate.test.mjs
          npm test
      - name: No tracked changes
        run: test -z "$(git status --porcelain --untracked-files=no)"
