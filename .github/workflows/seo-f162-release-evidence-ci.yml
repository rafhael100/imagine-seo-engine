name: SEO F162 - private release evidence contract (offline)
on:
  pull_request:
    paths:
      - '.github/workflows/seo-f162-release-evidence-ci.yml'
      - 'src/release-evidence-inventory.mjs'
      - 'scripts/review-release-evidence-offline.mjs'
      - 'tests/release-evidence-inventory.test.mjs'
      - 'docs/SEO-F162-RELEASE-EVIDENCE-GATE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout with no persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test release evidence fail-closed contracts
        run: |
          set -euo pipefail
          node --test tests/release-evidence-inventory.test.mjs
          node --check scripts/review-release-evidence-offline.mjs
