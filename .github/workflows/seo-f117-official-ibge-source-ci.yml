# RC45 unified candidate: offline checks never substitute for the explicit live IBGE gate.
name: SEO F120 - IBGE source contract and explicit live gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/seo-f117-official-ibge-source-ci.yml'
      - 'src/ibge-localities-offline-import.mjs'
      - 'src/ibge-official-https-capture.mjs'
      - 'src/ibge-source-receipt-review.mjs'
      - 'src/ibge-national-edition-coverage.mjs'
      - 'src/ibge-receipt-national-crosscheck.mjs'
      - 'src/ibge-three-source-release-review.mjs'
      - 'src/ibge-independent-dtb-crosscheck.mjs'
      - 'scripts/review-ibge-receipt-national-offline.mjs'
      - 'scripts/review-ibge-three-source-offline.mjs'
      - 'scripts/normalize-official-dtb-2025.py'
      - 'scripts/compare-pinned-dtb-areas2025.py'
      - 'scripts/reconcile-pinned-ibge-two-products.py'
      - 'src/ibge-local-expected-digest.mjs'
      - 'scripts/capture-official-ibge-reference.mjs'
      - 'scripts/verify-ibge-official-receipt.mjs'
      - 'tests/ibge-official-https-capture.test.mjs'
      - 'tests/ibge-source-receipt-review.test.mjs'
      - 'docs/SEO-OFFICIAL-LOCALITIES-PARITY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    name: IBGE source and receipt contracts - Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout candidate source without retained GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run full offline source, privacy and integrity regressions
        run: npm test

  live-official-source:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'verify-official-ibge')
    needs: offline-contract
    name: Explicit official IBGE HTTPS check - MUST pass before release
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate source without retained GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Capture public IBGE HTTPS data and exact SHA-256 receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/capture-official-ibge-reference.mjs \
            "$RUNNER_TEMP/seo-f120-ibge-ref.json" \
            "$RUNNER_TEMP/seo-f120-ibge-receipt.json"
      - name: Independently verify original HTTPS download receipt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-ibge-official-receipt.mjs \
            "$RUNNER_TEMP/seo-f120-ibge-ref.json" \
            "$RUNNER_TEMP/seo-f120-ibge-receipt.json"
      - name: F154/F153 reject incomplete official national dataset
        shell: bash
        run: |
          set -euo pipefail
          node scripts/review-ibge-receipt-national-offline.mjs \
            "$RUNNER_TEMP/seo-f120-ibge-ref.json" \
            "$RUNNER_TEMP/seo-f120-ibge-receipt.json"
      - name: F157 compare the same captured reference with the pinned official DTB
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dtb="$RUNNER_TEMP/seo-f120-dtb-2025.zip"
          csv="$RUNNER_TEMP/seo-f120-dtb-2025.csv"
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --retry 0 --connect-timeout 10 --max-time 45 --max-filesize 5000000 \
            --output "$dtb" \
            'https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2025/DTB_2025.zip'
          printf '%s  %s\n' d077a0e48c36cf18bcc96268b4a436200c014c6b8522c1a62d894acaf39dad27 "$dtb" | sha256sum --check --status
          python3 scripts/normalize-official-dtb-2025.py "$dtb" "$csv"
          test "$(stat -c %a "$csv")" = 600
          node scripts/review-ibge-three-source-offline.mjs \
            "$RUNNER_TEMP/seo-f120-ibge-ref.json" \
            "$RUNNER_TEMP/seo-f120-ibge-receipt.json" "$csv"
      - name: F177 reconcile that DTB with pinned Areas and the two known exclusions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          area="$RUNNER_TEMP/seo-f120-areas-2025.ods"
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --retry 0 --connect-timeout 10 --max-time 45 --max-filesize 1000000 \
            --output "$area" \
            'https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/areas_territoriais/2025/AR_BR_RG_UF_RGINT_RGI_MUN_2025.ods'
          printf '%s  %s\n' 029219bb994d87750fbe7d26c31217152a7e95449ddd2d2f26b504cb32a425f1 "$area" | sha256sum --check --status
          python3 scripts/reconcile-pinned-ibge-two-products.py \
            "$RUNNER_TEMP/seo-f120-dtb-2025.csv" "$area"
      - name: Delete ephemeral source files even after a failure
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/seo-f120-ibge-ref.json" \
            "$RUNNER_TEMP/seo-f120-ibge-receipt.json" \
            "$RUNNER_TEMP/seo-f120-dtb-2025.zip" \
            "$RUNNER_TEMP/seo-f120-dtb-2025.csv" \
            "$RUNNER_TEMP/seo-f120-areas-2025.ods"
