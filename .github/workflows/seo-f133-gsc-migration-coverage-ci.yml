name: SEO F133 - GSC historic URLs to 301 migration coverage
on:
  pull_request:
    paths:
      - 'src/gsc-legacy-redirect-coverage.mjs'
      - 'tests/gsc-legacy-redirect-coverage.test.mjs'
      - 'docs/SEO-F133-GSC-MIGRATION-COVERAGE.md'
      - '.github/workflows/seo-f133-gsc-migration-coverage-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gsc-migration-coverage:
    name: Independent GSC and F127 review / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and full offline regression suite
        run: |
          set -euo pipefail
          node --check src/gsc-legacy-redirect-coverage.mjs
          node --check tests/gsc-legacy-redirect-coverage.test.mjs
          npm test
      - name: No tracked mutation
        run: test -z "$(git status --porcelain --untracked-files=no)"
